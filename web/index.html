<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>llmbox</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; height: 100vh; display: flex; background: #f5f5f5; }

        /* 侧栏 */
        .sidebar { width: 240px; background: #1a1a2e; color: #eee; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 16px; font-size: 18px; font-weight: 700; border-bottom: 1px solid #333; }
        .sidebar-actions { padding: 12px; }
        .sidebar-actions button { width: 100%; padding: 8px; background: #16213e; color: #eee; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .sidebar-actions button:hover { background: #1a1a4e; }
        .session-list { flex: 1; overflow-y: auto; padding: 8px; }
        .session-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .session-item:hover { background: #16213e; }
        .session-item.active { background: #0f3460; }
        .session-item .delete-btn { opacity: 0; background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 16px; padding: 0 4px; }
        .session-item:hover .delete-btn { opacity: 1; }

        /* 主区域 */
        .main { flex: 1; display: flex; flex-direction: column; }

        /* 消息列表 */
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; }
        .message.user { align-self: flex-end; background: #0084ff; color: white; border-bottom-right-radius: 4px; }
        .message.assistant { align-self: flex-start; background: white; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* 工具调用 */
        .tool-call { align-self: flex-start; background: #fff3cd; color: #856404; padding: 8px 12px; border-radius: 8px; font-size: 13px; border-left: 3px solid #ffc107; max-width: 75%; }
        .tool-call-header { cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .tool-call-header .arrow { transition: transform 0.2s; font-size: 12px; }
        .tool-call-header .arrow.open { transform: rotate(90deg); }
        .tool-call-detail { margin-top: 6px; padding: 6px; background: rgba(0,0,0,0.05); border-radius: 4px; font-family: monospace; font-size: 12px; white-space: pre-wrap; display: none; }
        .tool-call-detail.show { display: block; }
        .tool-result { align-self: flex-start; background: #d4edda; color: #155724; padding: 8px 12px; border-radius: 8px; font-size: 13px; border-left: 3px solid #28a745; max-width: 75%; }

        /* 输入区域 */
        .input-area { padding: 16px 20px; background: white; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; }
        .input-area textarea { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; resize: none; font-size: 14px; font-family: inherit; outline: none; min-height: 42px; max-height: 120px; }
        .input-area textarea:focus { border-color: #0084ff; }
        .input-area button { padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
        .input-area button:hover { background: #0073e6; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }

        /* 空状态 */
        .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #999; font-size: 16px; }
    </style>
</head>
<body x-data="chatApp()" x-init="init()">
    <!-- 侧栏 -->
    <div class="sidebar">
        <div class="sidebar-header">llmbox</div>
        <div class="sidebar-actions">
            <button @click="createSession()">+ 新建会话</button>
        </div>
        <div class="session-list">
            <template x-for="s in sessions" :key="s.id">
                <div class="session-item" :class="{ active: s.id === sessionId }" @click="switchSession(s.id)">
                    <span x-text="'会话 ' + s.id.slice(0, 6)"></span>
                    <button class="delete-btn" @click.stop="deleteSession(s.id)">&times;</button>
                </div>
            </template>
        </div>
    </div>

    <!-- 主区域 -->
    <div class="main">
        <div class="messages" x-ref="messages">
            <template x-if="!sessionId">
                <div class="empty-state">点击「新建会话」开始对话</div>
            </template>
            <template x-for="(msg, i) in currentMessages" :key="i">
                <div>
                    <!-- 用户消息 -->
                    <div x-show="msg.type === 'user'" class="message user" x-text="msg.content"></div>
                    <!-- Agent 文本 -->
                    <div x-show="msg.type === 'assistant'" class="message assistant">
                        <span x-html="renderMarkdown(msg.content)"></span>
                    </div>
                    <!-- 工具调用 -->
                    <div x-show="msg.type === 'tool_call'" class="tool-call">
                        <div class="tool-call-header" @click="msg.expanded = !msg.expanded">
                            <span class="arrow" :class="{ open: msg.expanded }">&#9654;</span>
                            <span>调用工具: <strong x-text="msg.tool"></strong></span>
                        </div>
                        <div class="tool-call-detail" :class="{ show: msg.expanded }" x-text="JSON.stringify(msg.args, null, 2)"></div>
                    </div>
                    <!-- 工具结果 -->
                    <div x-show="msg.type === 'tool_result'" class="tool-result">
                        <strong x-text="msg.tool + ': '"></strong><span x-text="msg.result"></span>
                    </div>
                </div>
            </template>
            <!-- 流式输入指示器 -->
            <div x-show="streaming" class="message assistant">
                <span x-html="streamBuffer"></span><span style="animation: blink 1s infinite;">|</span>
            </div>
        </div>

        <div class="input-area">
            <textarea
                x-model="input"
                @keydown.enter.prevent="sendMessage()"
                placeholder="输入消息... (Enter 发送)"
                rows="1"
                :disabled="!sessionId || streaming"
            ></textarea>
            <button @click="sendMessage()" :disabled="!input.trim() || !sessionId || streaming">发送</button>
        </div>
    </div>

    <style>
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>

    <script>
    function chatApp() {
        return {
            sessions: [],
            sessionId: null,
            messages: {},  // sessionId -> messages[]
            input: '',
            streaming: false,
            streamBuffer: '',

            get currentMessages() {
                return this.messages[this.sessionId] || [];
            },

            async init() {
                await this.refreshSessions();
            },

            async refreshSessions() {
                const res = await fetch('/api/sessions');
                const data = await res.json();
                this.sessions = data.sessions;
            },

            async createSession() {
                const res = await fetch('/api/sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
                const data = await res.json();
                this.messages[data.session_id] = [];
                await this.refreshSessions();
                this.sessionId = data.session_id;
            },

            async switchSession(id) {
                this.sessionId = id;
                if (!this.messages[id]) {
                    this.messages[id] = [];
                }
                this.$nextTick(() => this.scrollToBottom());
            },

            async deleteSession(id) {
                await fetch(`/api/sessions/${id}`, { method: 'DELETE' });
                delete this.messages[id];
                if (this.sessionId === id) {
                    this.sessionId = null;
                }
                await this.refreshSessions();
            },

            async sendMessage() {
                const text = this.input.trim();
                if (!text || !this.sessionId || this.streaming) return;

                this.input = '';
                this.messages[this.sessionId].push({ type: 'user', content: text });
                this.streaming = true;
                this.streamBuffer = '';
                this.$nextTick(() => this.scrollToBottom());

                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: this.sessionId, message: text }),
                    });

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });

                        // 解析 SSE 事件
                        const lines = buffer.split('\n');
                        buffer = lines.pop();  // 保留未完成的行
                        let eventType = null;

                        for (const line of lines) {
                            if (line.startsWith('event: ')) {
                                eventType = line.slice(7).trim();
                            } else if (line.startsWith('data: ') && eventType) {
                                const data = JSON.parse(line.slice(6));
                                this.handleSSEEvent(eventType, data);
                                eventType = null;
                            }
                        }
                    }
                } catch (err) {
                    this.messages[this.sessionId].push({ type: 'assistant', content: '错误: ' + err.message });
                }

                // 如果流式 buffer 有内容，追加为 assistant 消息
                if (this.streamBuffer) {
                    this.messages[this.sessionId].push({ type: 'assistant', content: this.streamBuffer });
                }
                this.streaming = false;
                this.streamBuffer = '';
                this.$nextTick(() => this.scrollToBottom());
            },

            handleSSEEvent(type, data) {
                if (type === 'text') {
                    this.streamBuffer += data.content;
                    this.$nextTick(() => this.scrollToBottom());
                } else if (type === 'tool_call') {
                    // 先保存当前 streamBuffer
                    if (this.streamBuffer) {
                        this.messages[this.sessionId].push({ type: 'assistant', content: this.streamBuffer });
                        this.streamBuffer = '';
                    }
                    this.messages[this.sessionId].push({
                        type: 'tool_call',
                        tool: data.tool,
                        args: data.args,
                        expanded: false,
                    });
                } else if (type === 'tool_result') {
                    this.messages[this.sessionId].push({
                        type: 'tool_result',
                        tool: data.tool,
                        result: data.result,
                    });
                } else if (type === 'done') {
                    // done 事件在 sendMessage 的 finally 中处理
                } else if (type === 'error') {
                    this.streamBuffer += '\n错误: ' + data.message;
                }
            },

            scrollToBottom() {
                const el = this.$refs.messages;
                if (el) el.scrollTop = el.scrollHeight;
            },

            renderMarkdown(text) {
                // 简单的代码块渲染
                return text
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/`([^`]+)`/g, '<code style="background:#f0f0f0;padding:2px 4px;border-radius:3px;">$1</code>')
                    .replace(/\n/g, '<br>');
            },
        };
    }
    </script>
</body>
</html>
