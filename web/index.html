<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>llmbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        :root {
            --bg-page: #f5f0eb;
            --bg-surface: #ffffff;
            --bg-elevated: #faf8f5;
            --bg-hover: #f0ebe4;
            --bg-inset: #ece7e0;
            --border: #e2dbd3;
            --border-light: #ece7e0;
            --cocoa: #3d2e24;
            --cocoa-light: #6b5a4e;
            --cocoa-muted: #9c8e82;
            --caramel: #8b6a4e;
            --caramel-light: #a8896c;
            --caramel-bg: #8b6a4e12;
            --caramel-border: #8b6a4e30;
            --green: #5a8a5e;
            --green-bg: #5a8a5e10;
            --green-border: #5a8a5e30;
            --red: #c45d3e;
            --font-mono: 'Space Mono', 'Menlo', monospace;
            --font-sans: 'Outfit', -apple-system, sans-serif;
            --shadow-sm: 0 1px 3px rgba(61,46,36,0.04), 0 1px 2px rgba(61,46,36,0.06);
            --shadow-md: 0 4px 12px rgba(61,46,36,0.06), 0 2px 4px rgba(61,46,36,0.04);
            --shadow-lg: 0 8px 30px rgba(61,46,36,0.08), 0 4px 8px rgba(61,46,36,0.04);
            --radius: 14px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            background: var(--bg-page);
            color: var(--cocoa);
            overflow: hidden;
        }

        /* ========== 侧栏 ========== */
        .sidebar {
            width: 240px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px 20px 20px;
            border-bottom: 1px solid var(--border-light);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(145deg, var(--caramel), var(--cocoa-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 16px;
            color: var(--bg-surface);
            box-shadow: var(--shadow-md);
        }

        .brand-name {
            font-family: var(--font-mono);
            font-size: 17px;
            font-weight: 700;
            color: var(--cocoa);
            letter-spacing: -0.5px;
        }

        .brand-tag {
            font-size: 11px;
            color: var(--cocoa-muted);
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 1px;
        }

        .sidebar-actions {
            padding: 16px;
        }

        .btn-new {
            width: 100%;
            padding: 10px 14px;
            background: var(--cocoa);
            color: var(--bg-surface);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .btn-new:hover {
            background: var(--cocoa-light);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .sidebar-label {
            padding: 4px 16px 8px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--cocoa-muted);
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 10px;
        }

        .session-list::-webkit-scrollbar { width: 4px; }
        .session-list::-webkit-scrollbar-track { background: transparent; }
        .session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .session-item {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--cocoa-light);
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }

        .session-item:hover {
            background: var(--bg-hover);
            color: var(--cocoa);
        }

        .session-item.active {
            background: var(--bg-elevated);
            border-color: var(--border);
            color: var(--cocoa);
            box-shadow: var(--shadow-sm);
        }

        .session-item .sid {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .session-item .sid::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--border);
            flex-shrink: 0;
            transition: all 0.15s;
        }

        .session-item.active .sid::before {
            background: var(--caramel);
            box-shadow: 0 0 0 3px var(--caramel-bg);
        }

        .session-item .delete-btn {
            opacity: 0;
            background: none;
            border: none;
            color: var(--red);
            cursor: pointer;
            font-size: 15px;
            padding: 0 2px;
            transition: opacity 0.15s;
        }

        .session-item:hover .delete-btn { opacity: 0.5; }
        .session-item .delete-btn:hover { opacity: 1; }

        /* ========== 主区域 ========== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 50px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-surface);
            flex-shrink: 0;
        }

        .topbar-left {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--cocoa-muted);
            letter-spacing: 0.5px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--cocoa-muted);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            background: var(--green-bg);
            border: 1px solid var(--green-border);
            border-radius: 20px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--green);
        }

        .status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
        }

        /* ========== 消息列表 ========== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px 40px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* 空状态 */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .empty-icon {
            width: 72px;
            height: 72px;
            background: var(--bg-surface);
            border: 2px solid var(--border);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 28px;
            font-weight: 700;
            color: var(--cocoa-muted);
            box-shadow: var(--shadow-md);
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--cocoa);
        }

        .empty-state p {
            font-size: 14px;
            color: var(--cocoa-muted);
        }

        /* 消息行 */
        .msg-row {
            display: flex;
            flex-direction: column;
            animation: msg-in 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes msg-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-label {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            padding-left: 2px;
        }

        .msg-label.user { color: var(--caramel); }
        .msg-label.assistant { color: var(--cocoa-muted); }

        .msg-bubble {
            max-width: 72%;
            font-size: 15px;
            line-height: 1.7;
            word-break: break-word;
        }

        .msg-bubble.user {
            align-self: flex-end;
            background: var(--cocoa);
            color: var(--bg-surface);
            padding: 12px 18px;
            border-radius: var(--radius) var(--radius) 4px var(--radius);
            box-shadow: var(--shadow-sm);
        }

        .msg-bubble.assistant {
            align-self: flex-start;
            background: transparent;
            color: var(--cocoa);
            padding-left: 2px;
        }

        .msg-bubble.assistant code {
            font-family: var(--font-mono);
            font-size: 13px;
            background: var(--bg-inset);
            padding: 2px 7px;
            border-radius: 5px;
            color: var(--caramel);
        }

        .msg-bubble.assistant pre {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin: 10px 0;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.6;
            box-shadow: var(--shadow-sm);
        }

        /* 工具调用 */
        .tool-entry {
            align-self: flex-start;
            max-width: 80%;
            margin: 6px 0;
        }

        .tool-call-box {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s;
        }

        .tool-call-box:hover {
            box-shadow: var(--shadow-md);
        }

        .tool-call-header {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            transition: background 0.15s;
        }

        .tool-call-header:hover { background: var(--bg-hover); }

        .tool-call-header .arrow {
            font-size: 10px;
            transition: transform 0.2s;
            color: var(--cocoa-muted);
        }

        .tool-call-header .arrow.open { transform: rotate(90deg); }

        .tool-tag {
            padding: 2px 8px;
            background: var(--caramel-bg);
            border: 1px solid var(--caramel-border);
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--caramel);
        }

        .tool-call-header .tool-name {
            font-weight: 700;
            color: var(--cocoa);
        }

        .tool-call-header .tool-args-preview {
            color: var(--cocoa-muted);
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tool-call-detail {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .tool-call-detail.open { max-height: 300px; }

        .tool-call-detail pre {
            margin: 0;
            padding: 12px 14px;
            background: var(--bg-elevated);
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.6;
            color: var(--cocoa-light);
            border-top: 1px solid var(--border-light);
            overflow-x: auto;
        }

        /* 工具结果 */
        .tool-result-box {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            margin: 4px 0;
            box-shadow: var(--shadow-sm);
        }

        .tool-result-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .result-tag {
            padding: 2px 8px;
            background: var(--green-bg);
            border: 1px solid var(--green-border);
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--green);
        }

        .result-tool-name {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--cocoa-muted);
        }

        .result-content {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--cocoa-light);
            line-height: 1.5;
        }

        /* 流式光标 */
        .streaming-indicator {
            display: inline-block;
            width: 2px;
            height: 16px;
            background: var(--caramel);
            margin-left: 2px;
            animation: cursor-blink 0.7s step-end infinite;
            vertical-align: text-bottom;
            border-radius: 1px;
        }

        @keyframes cursor-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ========== 输入区域 ========== */
        .input-area {
            padding: 16px 40px 24px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-light);
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: var(--bg-page);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 5px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--caramel-light);
            box-shadow: 0 0 0 3px var(--caramel-bg);
        }

        .input-wrapper textarea {
            flex: 1;
            padding: 10px 14px;
            background: transparent;
            border: none;
            resize: none;
            font-family: var(--font-sans);
            font-size: 15px;
            color: var(--cocoa);
            outline: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.5;
        }

        .input-wrapper textarea::placeholder { color: var(--cocoa-muted); }

        .btn-send {
            width: 44px;
            height: 44px;
            background: var(--cocoa);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .btn-send:hover:not(:disabled) {
            background: var(--caramel);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .btn-send:disabled {
            background: var(--border);
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-send svg {
            width: 18px;
            height: 18px;
            fill: var(--bg-surface);
        }

        .input-hint {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--cocoa-muted);
            margin-top: 8px;
            padding-left: 4px;
            letter-spacing: 0.3px;
        }

        /* ========== 通知 Toast ========== */
        .toast-container {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-left: 4px solid var(--caramel);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            box-shadow: var(--shadow-lg);
            max-width: 360px;
            animation: toast-in 0.3s ease-out;
            pointer-events: auto;
        }

        .toast.fade-out {
            animation: toast-out 0.3s ease-in forwards;
        }

        .toast-title {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--caramel);
            margin-bottom: 4px;
        }

        .toast-body {
            font-size: 13px;
            color: var(--cocoa);
            line-height: 1.4;
            word-break: break-word;
        }

        @keyframes toast-in {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes toast-out {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(20px); }
        }
    </style>
</head>
<body x-data="chatApp()" x-init="init()">
    <!-- 通知 Toast -->
    <div class="toast-container">
        <template x-for="(t, i) in toasts" :key="t.id">
            <div class="toast" :class="{ 'fade-out': t.fading }">
                <div class="toast-title" x-text="t.title"></div>
                <div class="toast-body" x-text="t.body"></div>
            </div>
        </template>
    </div>

    <!-- 侧栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="brand-row">
                <div class="logo">L</div>
                <div>
                    <div class="brand-name">llmbox</div>
                    <div class="brand-tag">local agent</div>
                </div>
            </div>
        </div>
        <div class="sidebar-actions">
            <button class="btn-new" @click="createSession()">+ New Session</button>
        </div>
        <div class="sidebar-label">Sessions</div>
        <div class="session-list">
            <template x-for="s in sessions" :key="s.id">
                <div class="session-item" :class="{ active: s.id === sessionId }" @click="switchSession(s.id)">
                    <span class="sid" x-text="s.id.slice(0, 8)"></span>
                    <button class="delete-btn" @click.stop="deleteSession(s.id)">&times;</button>
                </div>
            </template>
        </div>
    </div>

    <!-- 主区域 -->
    <div class="main">
        <div class="topbar">
            <div class="topbar-left" x-text="sessionId ? 'Session ' + sessionId.slice(0, 8) : ''"></div>
            <div class="topbar-right">
                <span class="status-badge">READY</span>
            </div>
        </div>

        <div class="messages" x-ref="messages">
            <template x-if="!sessionId">
                <div class="empty-state">
                    <div class="empty-icon">L</div>
                    <h3>Welcome to llmbox</h3>
                    <p>Create a session to start chatting</p>
                </div>
            </template>
            <template x-for="(msg, i) in currentMessages" :key="i">
                <div class="msg-row">
                    <template x-if="msg.type === 'user'">
                        <div>
                            <div class="msg-label user">you</div>
                            <div class="msg-bubble user" x-text="msg.content"></div>
                        </div>
                    </template>
                    <template x-if="msg.type === 'assistant'">
                        <div>
                            <div class="msg-label assistant">agent</div>
                            <div class="msg-bubble assistant" x-html="renderMarkdown(msg.content)"></div>
                        </div>
                    </template>
                    <template x-if="msg.type === 'tool_call'">
                        <div class="tool-entry">
                            <div class="tool-call-box">
                                <div class="tool-call-header" @click="msg.expanded = !msg.expanded">
                                    <span class="arrow" :class="{ open: msg.expanded }">&#9654;</span>
                                    <span class="tool-tag">TOOL</span>
                                    <span class="tool-name" x-text="msg.tool"></span>
                                    <span class="tool-args-preview" x-text="formatArgsPreview(msg.args)"></span>
                                </div>
                                <div class="tool-call-detail" :class="{ open: msg.expanded }">
                                    <pre x-text="JSON.stringify(msg.args, null, 2)"></pre>
                                </div>
                            </div>
                        </div>
                    </template>
                    <template x-if="msg.type === 'tool_result'">
                        <div class="tool-result-box">
                            <div class="tool-result-header">
                                <span class="result-tag">RESULT</span>
                                <span class="result-tool-name" x-text="msg.tool"></span>
                            </div>
                            <div class="result-content" x-text="msg.result"></div>
                        </div>
                    </template>
                </div>
            </template>

            <template x-if="streaming">
                <div class="msg-row">
                    <div class="msg-label assistant">agent</div>
                    <div class="msg-bubble assistant">
                        <span x-html="renderMarkdown(streamBuffer)"></span><span class="streaming-indicator"></span>
                    </div>
                </div>
            </template>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea
                    x-model="input"
                    @keydown.enter.prevent="sendMessage()"
                    placeholder="Type a message..."
                    rows="1"
                    :disabled="!sessionId || streaming"
                ></textarea>
                <button class="btn-send" @click="sendMessage()" :disabled="!input.trim() || !sessionId || streaming">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
            <div class="input-hint">press enter to send</div>
        </div>
    </div>

    <script>
    function chatApp() {
        return {
            sessions: [],
            sessionId: null,
            messages: {},
            input: '',
            streaming: false,
            streamBuffer: '',
            toasts: [],
            _toastId: 0,

            get currentMessages() {
                return this.messages[this.sessionId] || [];
            },

            async init() {
                await this.refreshSessions();
                this.connectNotifications();
            },

            connectNotifications() {
                const es = new EventSource('/api/events');
                es.addEventListener('notification', (e) => {
                    const data = JSON.parse(e.data);
                    this.showToast(data.title, data.body);
                });
                es.onerror = () => {
                    es.close();
                    // 3 秒后重连
                    setTimeout(() => this.connectNotifications(), 3000);
                };
            },

            showToast(title, body) {
                const id = ++this._toastId;
                this.toasts.push({ id, title, body, fading: false });
                setTimeout(() => {
                    const t = this.toasts.find(t => t.id === id);
                    if (t) t.fading = true;
                    setTimeout(() => {
                        this.toasts = this.toasts.filter(t => t.id !== id);
                    }, 300);
                }, 5000);
            },

            async refreshSessions() {
                const res = await fetch('/api/sessions');
                const data = await res.json();
                this.sessions = data.sessions;
            },

            async createSession() {
                const res = await fetch('/api/sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
                const data = await res.json();
                this.messages[data.session_id] = [];
                await this.refreshSessions();
                this.sessionId = data.session_id;
            },

            async switchSession(id) {
                this.sessionId = id;
                if (!this.messages[id]) this.messages[id] = [];
                this.$nextTick(() => this.scrollToBottom());
            },

            async deleteSession(id) {
                await fetch(`/api/sessions/${id}`, { method: 'DELETE' });
                delete this.messages[id];
                if (this.sessionId === id) this.sessionId = null;
                await this.refreshSessions();
            },

            async sendMessage() {
                const text = this.input.trim();
                if (!text || !this.sessionId || this.streaming) return;

                this.input = '';
                this.messages[this.sessionId].push({ type: 'user', content: text });
                this.streaming = true;
                this.streamBuffer = '';
                this.$nextTick(() => this.scrollToBottom());

                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: this.sessionId, message: text }),
                    });

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });

                        const lines = buffer.split('\n');
                        buffer = lines.pop();
                        let eventType = null;

                        for (const line of lines) {
                            if (line.startsWith('event: ')) {
                                eventType = line.slice(7).trim();
                            } else if (line.startsWith('data: ') && eventType) {
                                const data = JSON.parse(line.slice(6));
                                this.handleSSEEvent(eventType, data);
                                eventType = null;
                            }
                        }
                    }
                } catch (err) {
                    this.messages[this.sessionId].push({ type: 'assistant', content: 'error: ' + err.message });
                }

                if (this.streamBuffer) {
                    this.messages[this.sessionId].push({ type: 'assistant', content: this.streamBuffer });
                }
                this.streaming = false;
                this.streamBuffer = '';
                this.$nextTick(() => this.scrollToBottom());
            },

            handleSSEEvent(type, data) {
                if (type === 'text') {
                    this.streamBuffer += data.content;
                    this.$nextTick(() => this.scrollToBottom());
                } else if (type === 'tool_call') {
                    if (this.streamBuffer) {
                        this.messages[this.sessionId].push({ type: 'assistant', content: this.streamBuffer });
                        this.streamBuffer = '';
                    }
                    this.messages[this.sessionId].push({
                        type: 'tool_call', tool: data.tool, args: data.args, expanded: false,
                    });
                } else if (type === 'tool_result') {
                    this.messages[this.sessionId].push({
                        type: 'tool_result', tool: data.tool, result: data.result,
                    });
                } else if (type === 'error') {
                    this.streamBuffer += '\nerror: ' + data.message;
                }
            },

            scrollToBottom() {
                const el = this.$refs.messages;
                if (el) el.scrollTop = el.scrollHeight;
            },

            formatArgsPreview(args) {
                const keys = Object.keys(args);
                if (keys.length === 0) return '{}';
                const first = args[keys[0]];
                const preview = typeof first === 'string' ? first.slice(0, 30) : JSON.stringify(first);
                return keys.length === 1 ? preview : `${keys[0]}: ${preview}...`;
            },

            renderMarkdown(text) {
                return text
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n/g, '<br>');
            },
        };
    }
    </script>
